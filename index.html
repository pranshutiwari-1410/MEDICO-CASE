<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Case File</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background: radial-gradient(circle at top, #ffe6ec, #f3c6d3, #e6a8ba);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #2a1a1f;
    }
    .heart {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      pointer-events: none;
      animation: floatUp 10s linear forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(110vh); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-20vh); opacity: 0; }
    }
    .file {
      backdrop-filter: blur(18px);
      background: rgba(255,255,255,0.55);
      border-radius: 22px;
      padding: 36px;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.18);
      position: relative;
      z-index: 10;
      max-height: 90vh;
      overflow-y: auto;
    }
    h1 { margin: 0; font-size: 1.8rem; }
    .tag {
      display: inline-block;
      background: rgba(230,90,125,0.15);
      color: #b13055;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      margin-top: 10px;
    }
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(0,0,0,0.15), transparent);
      margin: 24px 0;
    }
    .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #7a4b58;
      margin-top: 18px;
    }
    .content {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-top: 6px;
    }
    .btn-container {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }
    button {
      flex: 1;
      padding: 15px;
      border-radius: 14px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      background: linear-gradient(135deg, #e14b7b, #f08ca2);
      color: white;
      box-shadow: 0 12px 25px rgba(225,75,123,0.35);
    }
    button.secondary {
      background: #f8f9fa;
      color: #7a4b58;
    }
    .image-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    .image-grid img {
      width: 100%;
      border-radius: 12px;
      object-fit: cover;
    }
  </style>
</head>

<body>

<div class="file" id="screen">
  <h1>Patient Case File</h1>
  <div class="tag">Confidential</div>
  <div class="divider"></div>

  <div class="label">Patient</div>
  <div class="content">Someone from UPUMS</div>

  <div class="label">Attending Physician</div>
  <div class="content">Dr Ishika 🩺</div>

  <div class="btn-container">
    <button onclick="next()">Open Case</button>
  </div>
</div>

<script>
  const emojis = ['❤️','💗','💖','💕','💓','💘','✨','🌸','💌','🧸','🌹'];
  function createHeart() {
    const heart = document.createElement('span');
    heart.className = 'heart';
    heart.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    heart.style.left = Math.random()*100 + '%';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 10000);
  }
  setInterval(createHeart, 1000);

  const screens = [
    `<h1>Chief Complaint</h1><div class="tag">Ongoing</div><div class="divider"></div>
     <div class="content">Persistent warmth in the chest when thinking about Ishika.</div>
     <div class="btn-container"><button onclick="next()">Review Symptoms</button></div>`,

    `<h1>Symptoms</h1><div class="tag">Documented</div><div class="divider"></div>
     <div class="content">• Smiling for no reason<br>• Calm when seeing you<br>• You are my favorite person</div>
     <div class="btn-container"><button onclick="next()">Assessment</button></div>`,

    `<h1>Assessment</h1><div class="tag">Stable</div><div class="divider"></div>
     <div class="content">Chronic and irreversible happiness.</div>
     <div class="btn-container"><button onclick="next()">Final Recommendation</button></div>`,

    `<h1>Final Recommendation</h1><div class="tag">High Priority</div><div class="divider"></div>
     <div class="content"><strong>Will you be my Valentine?</strong></div>
     <div class="btn-container">
       <button onclick="yes()">Accept 💌</button>
       <button class="secondary" onclick="reject()">Reject ❌</button>
     </div>`,

    `<h1>Case Closed</h1><div class="tag">Approved</div><div class="divider"></div>
     <div class="content">Thank you, Dr Ishika ❤️</div>`
  ];

  let index = 0;

  function next() {
    if (index < screens.length) {
      document.getElementById("screen").innerHTML = screens[index];
      index++;
    }
  }

  function yes() {
    confetti({ particleCount: 150, spread: 70 });
    document.getElementById("screen").innerHTML = screens[4];
  }

  function reject() {
    document.getElementById("screen").innerHTML =
      `<h1>Error 404</h1><div class="content">Rejection not permitted.</div>
       <div class="btn-container"><button onclick="yes()">Accept 💌</button></div>`;
  }
</script>

</body>
</html>
